  <path d="M32 8 L36.5 20.5 L50 21 L39.5 29.5 L43 43 L32 35.5 L21 43 L24.5 29.5 L14 21 L27.5 20.5 Z" fill="url(#starGrad)" stroke="#7C3AED" stroke-width="1" stroke-linejoin="round"/>
