  <circle cx="37.8" cy="24" r="0.8" fill="white"/>
  <!-- Smile -->
  <path d="M27 30 Q32 35 37 30" stroke="#3B0764" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Gold sparkle top-right -->
  <path d="M48 10 L49 13 L52 14 L49 15 L48 18 L47 15 L44 14 L47 13 Z" fill="#FFD700"/>
  <!-- Small sparkle top-left -->
  <path d="M12 16 L13 18 L15 19 L13 20 L12 22 L11 20 L9 19 L11 18 Z" fill="#F0ABFC"/>
